<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Edit Mahasiswa</title>
</head>
<body>

    <h1>Edit Mahasiswa</h1>

    {% if error %}
        <p style="color:red;">
            {{ error }}
        </p>
    {% endif %}

    <form method="POST">

        <p>
            <label>NIM:</label><br>
            <input
                type="number"
                value="{{ mahasiswa['nim'] }}"
                disabled
            >
        </p>

        <p>
            <label>Nama:</label><br>
            <input
                type="text"
                name="nama"
                value="{{ mahasiswa['nama'] }}"
                required
            >
        </p>

        <p>
            <label>Program Studi:</label><br>
            <input
                type="text"
                name="program_studi"
                value="{{ mahasiswa['program_studi'] }}"
                required
            >
        </p>

        <p>
            <label>Angkatan:</label><br>
            <input
                type="number"
                name="angkatan"
                value="{{ mahasiswa['angkatan'] }}"
                required
            >
        </p>

        <p>
            <label>IPK:</label><br>
            <input
                type="number"
                name="ipk"
                min="0"
                max="4"
                step="0.01"
                value="{{ mahasiswa['ipk'] }}"
                required
            >
        </p>

        <button type="submit">
            Simpan Perubahan
        </button>

    </form>

    <br>

    <a href="/">
        Kembali
    </a>

</body>
</html>
